<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Launchpad</title>
  <link rel="icon" type="image/png" href="/_space/logo.png">
  <link rel="stylesheet" href="/_space/shell.css">
  <link rel="stylesheet" href="/_space/vendor/xterm.css">
  <script src="/_space/theme.js"></script>
  <script src="/_space/vendor/xterm.js" defer></script>
  <script src="/_space/vendor/addon-fit.js" defer></script>
  <script src="/_space/shell.js" defer></script>
</head>
<body data-stage="loading">

  <!-- Normal use: a slim bar above the Launchpad app. -->
  <header class="bar" id="bar" hidden>
    <a class="bar-brand" href="/_space/shell?route=%2Fagents" title="Launchpad home"><img src="/_space/logo.png" alt="Launchpad" width="18" height="18"></a>
    <span class="bar-space" id="bar-space"></span>
    <button class="chip" id="bar-status" type="button"></button>
    <button class="chip work" id="available-update" type="button" aria-label="Update available: review the new version" hidden>Update<span class="update-detail"> available · Review</span></button>
    <button class="bar-button" id="open-panel" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm0 4.1a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm6.1-2.1-1.2-.2a5 5 0 0 0-.5-1.2l.7-1a.8.8 0 0 0-.1-1l-.7-.7a.8.8 0 0 0-1-.1l-1 .7a5 5 0 0 0-1.2-.5L8.9 2a.8.8 0 0 0-.8-.6h-1a.8.8 0 0 0-.8.6l-.2 1.2a5 5 0 0 0-1.2.5l-1-.7a.8.8 0 0 0-1 .1l-.7.7a.8.8 0 0 0-.1 1l.7 1a5 5 0 0 0-.5 1.2L1 7.2a.8.8 0 0 0-.6.8v1c0 .4.3.7.6.8l1.2.2c.1.4.3.8.5 1.2l-.7 1a.8.8 0 0 0 .1 1l.7.7c.3.3.7.3 1 .1l1-.7c.4.2.8.4 1.2.5l.2 1.2c.1.4.4.6.8.6h1c.4 0 .7-.3.8-.6l.2-1.2c.4-.1.8-.3 1.2-.5l1 .7c.3.2.7.2 1-.1l.7-.7c.3-.3.3-.7.1-1l-.7-1c.2-.4.4-.8.5-1.2l1.2-.2c.4-.1.6-.4.6-.8V8c0-.4-.3-.7-.6-.8Z"/></svg>
      <span>Space settings</span>
    </button>
    <button class="bar-fold" id="bar-fold" type="button" title="Hide this bar" aria-label="Hide this bar">▲</button>
  </header>
  <button class="bar-tab" id="bar-tab" type="button" title="Show the Space bar" aria-label="Show the Space bar" hidden>▼</button>
  <iframe id="app" title="Launchpad" allow="clipboard-read; clipboard-write" hidden></iframe>

  <!-- Every other stage: one centered setup page. -->
  <main class="setup" id="setup">
    <div class="setup-inner">
      <div class="brand"><img src="/_space/logo.png" alt="" width="28" height="28"><span>Launchpad</span><span class="brand-tag">on Hugging Face Spaces</span></div>
      <h1 id="title">Loading…</h1>
      <p class="lead" id="lead"></p>
      <ol class="steps" id="steps"></ol>
      <section id="stage-body"></section>
    </div>
  </main>

  <!-- Space settings drawer. -->
  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <div class="panel-head">
      <h2 id="panel-title">Space settings</h2>
      <button class="icon-button" id="close-panel" type="button" aria-label="Close Space settings">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
