[workspace]
resolver = "3"
members = ["crates/core", "crates/harness", "crates/channels", "crates/github", "crates/automation", "crates/setup", "crates/http", "crates/api", "crates/server", "crates/cli", "desktop/src-tauri"]
default-members = ["crates/core", "crates/harness", "crates/channels", "crates/github", "crates/automation", "crates/setup", "crates/http", "crates/api", "crates/server", "crates/cli"]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
debug = "line-tables-only"

# Fast local iteration: line tables are enough for backtraces, and dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
