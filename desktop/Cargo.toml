[package]
name = "launchpad-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Launchpad desktop companion for Ubuntu GNOME: top-bar menu, notifications and a global spotlight; the full UI stays in the browser"
license = "MIT"

# A workspace of its own: the root workspace excludes it, so root builds and runners never need GTK.
[workspace]

[lib]
name = "launchpad_desktop"
path = "src/lib.rs"

[[bin]]
name = "launchpad-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
async-channel = "2"
base64 = "0.22"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
ksni = "0.3"
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
