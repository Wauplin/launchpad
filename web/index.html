<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6f9" />
    <script>
      // Demo mode (src/demo/): `?demo=<chapter>` enters it, the tab's window.name keeps it across reloads. Storage
      // becomes memory only (seeded with a read-only copy of theme, zoom and layout) and every request waits for
      // the in-browser demo daemon, so nothing reaches the real daemon or the browser's storage.
      (function () {
        var params = new URLSearchParams(location.search);
        var entry = params.get("demo");
        if (entry === null && window.name.indexOf("lp-demo:") !== 0) return;
        if (entry !== null) window.name = "lp-demo:" + (entry === "1" ? "" : entry);
        window.__lpDemo = { chapter: window.name.slice(8), realFetch: window.fetch.bind(window) };
        function memory(seed) {
          var data = {};
          for (var k in seed) if (seed[k] !== null) data[k] = String(seed[k]);
          return {
            get length() { return Object.keys(data).length; },
            key: function (i) { return Object.keys(data)[i] ?? null; },
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
            setItem: function (k, v) { data[k] = String(v); },
            removeItem: function (k) { delete data[k]; },
            clear: function () { data = {}; },
          };
        }
        var seed = {};
        try { ["launchpad-theme", "launchpad-zoom", "launchpad-layout"].forEach(function (k) { seed[k] = localStorage.getItem(k); }); } catch (e) { /* No storage. */ }
        Object.defineProperty(window, "localStorage", { value: memory(seed), configurable: true });
        Object.defineProperty(window, "sessionStorage", { value: memory({}), configurable: true });
        var ready = new Promise(function (resolve) { window.__lpDemo.ready = resolve; });
        window.fetch = function (input, init) { return ready.then(function (d) { return d.fetch(input, init); }); };
      })();
      try {
        document.documentElement.dataset.theme = localStorage.getItem("launchpad-theme") === "dark" ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = "light"; }
      // Per-device zoom (src/lib/zoom.ts) and the phone layout (src/lib/phone.ts), before paint. The phone shell stays at 100%.
      try {
        var layout = localStorage.getItem("launchpad-layout");
        var phone = layout === "phone" || (layout !== "desktop" && !window.__launchpadDesktop && matchMedia("(max-width: 719px)").matches);
        var zoom = [100, 110, 120, 135, 150][Number(localStorage.getItem("launchpad-zoom") ?? 2)] ?? 120;
        document.documentElement.style.zoom = phone ? "1" : String(zoom / 100);
        if (phone) document.documentElement.classList.add("lp-phone");
      } catch { /* The app applies it after loading. */ }
      if (document.documentElement.dataset.theme === "dark") document.querySelector('meta[name="theme-color"]').content = "#161b22";
    </script>
    <link rel="icon" type="image/png" href="/src/assets/launchpad.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Launchpad" />
    <title>Launchpad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
