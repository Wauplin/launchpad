<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("launchpad-theme") === "dark" ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = "light"; }
      // Per-device zoom (src/lib/zoom.ts) and the phone layout (src/lib/phone.ts), before paint. The phone shell stays at 100%.
      try {
        var layout = localStorage.getItem("launchpad-layout");
        var phone = layout === "phone" || (layout !== "desktop" && !window.__launchpadDesktop && matchMedia("(max-width: 719px)").matches);
        var zoom = [100, 110, 120, 135, 150][Number(localStorage.getItem("launchpad-zoom") ?? 2)] ?? 120;
        document.documentElement.style.zoom = phone ? "1" : String(zoom / 100);
        if (phone) document.documentElement.classList.add("lp-phone");
      } catch { /* The app applies it after loading. */ }
    </script>
    <link rel="icon" type="image/png" href="/src/assets/launchpad.png" />
    <title>Launchpad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
