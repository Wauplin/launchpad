[package]
name = "launchpad-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
croner = "2.2.0"
async-trait = "0.1.92"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2.189"
notify = "8.2.0"
notify-rust = "4.18.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
ignore = "0.4.33"
portable-pty = "0.9"
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
hkdf = "0.13"
aes-gcm = "0.11"
serde_yaml_ng = "0.10"
