[package]
name = "launchpad"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
base64 = "0.22"
libc = "0.2.189"
launchpad-core = { version = "0.1.0", path = "../core" }
launchpad-channels = { version = "0.1.0", path = "../channels" }
launchpad-github = { version = "0.1.0", path = "../github" }
launchpad-automation = { version = "0.1.0", path = "../automation" }
launchpad-setup = { version = "0.1.0", path = "../setup" }
launchpad-harness = { version = "0.1.0", path = "../harness" }
launchpad-server = { version = "0.1.0", path = "../server" }
launchpad-api = { version = "0.1.0", path = "../api" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
