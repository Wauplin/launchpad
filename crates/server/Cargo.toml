[package]
name = "launchpad-server"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures-util = "0.3.34"
launchpad-core = { version = "0.1.0", path = "../core" }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }
sha2 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
hex = "0.4.3"
rand = "0.10.3"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = "0.29.0"
