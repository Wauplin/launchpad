[package]
name = "launchpad-automation"
version = "0.1.0"
edition = "2024"

# No doctests: skips a rustdoc pass on every `cargo test`.
[lib]
doctest = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
croner = "2.2.0"
launchpad-core = { version = "0.1.0", path = "../core" }
libc = "0.2.189"
monty = "=1.6.0"
monty-pool = "=1.6.0"
monty-types = "=1.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
ruff_text_size = "=0.0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
launchpad-harness = { version = "0.1.0", path = "../harness" }
