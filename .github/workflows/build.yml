name: Build

# Release build of the Linux x86_64 package. Called by ci.yml (tag pushes) and
# release.yml (manual releases). With `release-tag`, it also creates the tag and
# the GitHub release on the built commit, with the package attached.

on:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to create (empty for no release)
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

jobs:
  build:
    name: Build artifacts (linux-x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-ubuntu-22.04
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Build UI before embedding it in the daemon
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check installer syntax
        run: bash -n packaging/install.sh packaging/update.sh
      - name: Build release binaries
        run: cargo build --release --locked -p launchpad -p launchpad-desktop
      - name: Run release tests
        run: cargo test --release --locked
      - name: Smoke-test release CLI
        run: target/release/launchpad --help
      - name: Package release
        run: |
          mkdir -p artifacts/target/release artifacts/web artifacts/desktop/src-tauri
          cp target/release/launchpad target/release/launchpad-desktop artifacts/target/release/
          cp -r packaging skills artifacts/
          cp -r desktop/src-tauri/icons artifacts/desktop/src-tauri/
          cp -r web/dist artifacts/web/
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          tar -czf launchpad-linux-x86_64.tar.gz -C artifacts .
          sha256sum launchpad-linux-x86_64.tar.gz > launchpad-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-linux-x86_64
          path: |
            launchpad-linux-x86_64.tar.gz
            launchpad-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            launchpad-linux-x86_64.tar.gz \
            launchpad-linux-x86_64.tar.gz.sha256
