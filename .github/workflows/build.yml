name: Build

# Release build of the Linux x86_64 package. Called by ci.yml (tag and main pushes)
# and release.yml (manual releases). With `release-tag`, it also creates the tag and
# the GitHub release on the built commit, with the package and the Chrome extension
# zip attached (the package also holds the zip, in extension/). With `main-build`,
# it attaches the package of this main commit to the `main-build`
# prerelease (deploy/hf-home/deploy.sh --main deploys it).
# The `desktop` job builds the desktop companion's .deb (launchpad-desktop_<version>_amd64.deb and its .sha256) in an
# ubuntu:26.04 container, beside the package build; `publish-desktop` attaches it to the same release, or to
# main-build named by its version (which names the commit), keeping the 20 newest.

on:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to create (empty for no release)
        type: string
        default: ''
      main-build:
        description: Publish the package to the main-build prerelease, named by commit
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.0

jobs:
  build:
    name: Build artifacts (linux-x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-ubuntu-22.04
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Build UI before embedding it in the daemon
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the Chrome extension (zip of extension/dist, loaded unpacked; its manifest key pins the ID)
        working-directory: extension
        env:
          VITE_HF_CLIENT_ID: ${{ vars.HF_CLIENT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          (cd dist && zip -qr ../../launchpad-chrome-extension.zip .)
      - name: Check installer syntax
        run: bash -n packaging/install.sh
      - name: Build release binaries
        env:
          CARGO_INCREMENTAL: '0'
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WORKSPACE_WRAPPER: sccache
        run: cargo build --release --locked -p launchpad --timings
      - name: Upload Cargo timings
        # target/cargo-timings/cargo-timing.html: how long each crate took to compile and link.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-release
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Run release tests
        # Main builds skip them: ci.yml runs the tests of the same commit.
        if: ${{ !inputs.main-build }}
        env:
          CARGO_INCREMENTAL: '0'
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WORKSPACE_WRAPPER: sccache
        run: cargo test --release --locked
      - name: Smoke-test release CLI
        run: target/release/launchpad --help
      - name: Package release
        run: |
          mkdir -p artifacts/target/release artifacts/web
          cp target/release/launchpad artifacts/target/release/
          cp -r packaging skills artifacts/
          cp -r web/dist artifacts/web/
          mkdir -p artifacts/extension
          cp launchpad-chrome-extension.zip extension/README.md artifacts/extension/
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          # pigz: the same gzip format and size as tar -z, on every core (half the time).
          tar --use-compress-program=pigz -cf launchpad-linux-x86_64.tar.gz -C artifacts .
          sha256sum launchpad-linux-x86_64.tar.gz > launchpad-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-linux-x86_64
          path: |
            launchpad-linux-x86_64.tar.gz
            launchpad-linux-x86_64.tar.gz.sha256
            launchpad-chrome-extension.zip
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            launchpad-linux-x86_64.tar.gz \
            launchpad-linux-x86_64.tar.gz.sha256 \
            launchpad-chrome-extension.zip
      - name: Publish main build
        if: inputs.main-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the current main head: a superseded run must not publish.
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" ] || { echo "main moved on; not publishing"; exit 0; }
          tag=main-build name="launchpad-linux-x86_64-$GITHUB_SHA"
          cp launchpad-linux-x86_64.tar.gz "$name.tar.gz"
          sed "s/launchpad-linux-x86_64.tar.gz/$name.tar.gz/" launchpad-linux-x86_64.tar.gz.sha256 > "$name.tar.gz.sha256"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Builds of main" --notes "Packages of the latest main commits (launchpad-linux-x86_64-<commit>.tar.gz), used by deploy/hf-home/deploy.sh --main. Not a release."
          fi
          gh release upload "$tag" "$name.tar.gz" "$name.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          # Keep the packages of the 20 newest commits.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '[.assets[] | select(.name | endswith(".tar.gz"))] | sort_by(.created_at) | reverse | .[20:][] | .name' \
            | while read -r old; do
                gh release delete-asset "$tag" "$old" --repo "$GITHUB_REPOSITORY" -y
                gh release delete-asset "$tag" "$old.sha256" --repo "$GITHUB_REPOSITORY" -y || true
              done

  desktop:
    name: Desktop companion package (Ubuntu 26.04 amd64)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build tools and GTK 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libgtk-4-dev dpkg-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: desktop-release
          cache-on-failure: true
      - name: Package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          MAIN_BUILD: ${{ inputs.main-build }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag="$RELEASE_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          if printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            version="${tag#v}" channel=release
          else
            # Main builds: that day's .0~main.<time>.g<commit> sorts below its releases (.1 and up) and names the commit.
            version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d.0~main.%H%M%S).g$(git rev-parse --short=7 HEAD)"
            channel=main
          fi
          echo "Desktop package $version ($channel; main build: $MAIN_BUILD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Build the companion
        env:
          LAUNCHPAD_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          LAUNCHPAD_DESKTOP_CHANNEL: ${{ steps.version.outputs.channel }}
          LAUNCHPAD_HF_CLIENT_ID: ${{ vars.HF_DESKTOP_CLIENT_ID }}
        run: cargo build --manifest-path desktop/Cargo.toml --release --locked
      - name: Build the .deb (Depends from dpkg-shlibdeps)
        run: |
          deb=$(desktop/packaging/build-deb.sh "${{ steps.version.outputs.version }}" --out dist)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-desktop-deb
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-desktop:
    name: Publish the desktop companion package
    needs: [build, desktop]
    if: inputs.release-tag != '' || inputs.main-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: launchpad-desktop-deb
          path: dist
      - name: Attach to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: gh release upload "$TAG" dist/*.deb dist/*.deb.sha256 --repo "$GITHUB_REPOSITORY"
      - name: Attach to main-build
        if: inputs.main-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the current main head: a superseded run must not publish (the build job created the prerelease).
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" ] || { echo "main moved on; not publishing"; exit 0; }
          gh release upload main-build dist/*.deb dist/*.deb.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          # Keep the packages of the 20 newest commits.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/main-build" \
            --jq '[.assets[] | select(.name | endswith("_amd64.deb"))] | sort_by(.created_at) | reverse | .[20:][] | .name' \
            | while read -r old; do
                gh release delete-asset main-build "$old" --repo "$GITHUB_REPOSITORY" -y
                gh release delete-asset main-build "$old.sha256" --repo "$GITHUB_REPOSITORY" -y || true
              done
