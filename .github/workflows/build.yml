name: Build

# Release build of the Linux x86_64 package. Called by ci.yml (tag and main pushes)
# and release.yml (manual releases). With `release-tag`, it also creates the tag and
# the GitHub release on the built commit, with the package attached. With
# `main-build`, it attaches the package of this main commit to the `main-build`
# prerelease (deploy/hf-home/deploy.sh --main deploys it).

on:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to create (empty for no release)
        type: string
        default: ''
      main-build:
        description: Publish the package to the main-build prerelease, named by commit
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

jobs:
  build:
    name: Build artifacts (linux-x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-ubuntu-22.04
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Build UI before embedding it in the daemon
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check installer syntax
        run: bash -n packaging/install.sh
      - name: Build release binaries
        run: cargo build --release --locked -p launchpad
      - name: Run release tests
        # Main builds skip them: ci.yml runs the tests of the same commit.
        if: ${{ !inputs.main-build }}
        run: cargo test --release --locked
      - name: Smoke-test release CLI
        run: target/release/launchpad --help
      - name: Package release
        run: |
          mkdir -p artifacts/target/release artifacts/web
          cp target/release/launchpad artifacts/target/release/
          cp -r packaging skills artifacts/
          cp -r web/dist artifacts/web/
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          tar -czf launchpad-linux-x86_64.tar.gz -C artifacts .
          sha256sum launchpad-linux-x86_64.tar.gz > launchpad-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-linux-x86_64
          path: |
            launchpad-linux-x86_64.tar.gz
            launchpad-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            launchpad-linux-x86_64.tar.gz \
            launchpad-linux-x86_64.tar.gz.sha256
      - name: Publish main build
        if: inputs.main-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the current main head: a superseded run must not publish.
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" ] || { echo "main moved on; not publishing"; exit 0; }
          tag=main-build name="launchpad-linux-x86_64-$GITHUB_SHA"
          cp launchpad-linux-x86_64.tar.gz "$name.tar.gz"
          sed "s/launchpad-linux-x86_64.tar.gz/$name.tar.gz/" launchpad-linux-x86_64.tar.gz.sha256 > "$name.tar.gz.sha256"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Builds of main" --notes "Packages of the latest main commits (launchpad-linux-x86_64-<commit>.tar.gz), used by deploy/hf-home/deploy.sh --main. Not a release."
          fi
          gh release upload "$tag" "$name.tar.gz" "$name.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          # Keep the packages of the 20 newest commits.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '[.assets[] | select(.name | endswith(".tar.gz"))] | sort_by(.created_at) | reverse | .[20:][] | .name' \
            | while read -r old; do
                gh release delete-asset "$tag" "$old" --repo "$GITHUB_REPOSITORY" -y
                gh release delete-asset "$tag" "$old.sha256" --repo "$GITHUB_REPOSITORY" -y || true
              done
