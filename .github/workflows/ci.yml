name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Install UI dependencies
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Rust linting
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check UI types
        working-directory: web
        run: pnpm typecheck
      - name: Hook order lint
        working-directory: web
        run: pnpm lint:hooks
      - name: Check terminal output
        working-directory: web
        run: pnpm test:terminals
      - name: Check session log recovery
        working-directory: web
        run: pnpm test:sessions
      - name: Check operation retries
        working-directory: web
        run: pnpm test:operations
      - name: Composer defaults regressions
        working-directory: web
        run: pnpm test:composer
      - name: Ask proposal regressions
        working-directory: web
        run: pnpm test:proposals
      - name: Bot chat rows
        working-directory: web
        run: pnpm test:chat
      - name: Draft persistence regressions
        working-directory: web
        run: pnpm test:drafts
      - name: Tour anchors and demo handlers
        working-directory: web
        run: pnpm test:tour
      - name: Agent Markdown commit regressions
        working-directory: web
        run: pnpm test:markdown
      - name: Code viewer safety regressions
        working-directory: web
        run: pnpm test:code
      - name: Check clipboard attachments
        working-directory: web
        run: pnpm test:attachments

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Run Rust tests (default workspace members)
        run: cargo test --locked
      - name: Run Home Space tests (deploy/hf-home)
        working-directory: deploy/hf-home
        run: |
          python3 -m venv /tmp/hf-home-env
          /tmp/hf-home-env/bin/pip install -r requirements.txt
          /tmp/hf-home-env/bin/python -m unittest discover -s tests -v

  build:
    name: Release build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build.yml

  main-build:
    name: Main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      main-build: true
