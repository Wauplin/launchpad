name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Install UI dependencies
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Rust linting
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check UI types
        working-directory: web
        run: pnpm typecheck
      - name: Hook order lint
        working-directory: web
        run: pnpm lint:hooks
      - name: Check terminal output
        working-directory: web
        run: pnpm test:terminals
      - name: Check session log recovery
        working-directory: web
        run: pnpm test:sessions
      - name: Check operation retries
        working-directory: web
        run: pnpm test:operations
      - name: Composer defaults regressions
        working-directory: web
        run: pnpm test:composer
      - name: Ask proposal regressions
        working-directory: web
        run: pnpm test:proposals
      - name: Bot chat rows
        working-directory: web
        run: pnpm test:chat
      - name: Draft persistence regressions
        working-directory: web
        run: pnpm test:drafts
      - name: Tour anchors and demo handlers
        working-directory: web
        run: pnpm test:tour
      - name: Agent Markdown commit regressions
        working-directory: web
        run: pnpm test:markdown
      - name: Code viewer safety regressions
        working-directory: web
        run: pnpm test:code
      - name: Check clipboard attachments
        working-directory: web
        run: pnpm test:attachments
      - name: Pending review payload
        working-directory: web
        run: pnpm test:review
      - name: Folio splitter fixtures (shared with Home's)
        working-directory: web
        run: pnpm test:folios
      - name: Usage metrics
        working-directory: web
        run: pnpm test:usage

  extension:
    name: Chrome extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Install UI dependencies (the extension imports web/src)
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check and build the extension
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:suggestions
          pnpm build

  desktop:
    # The Linux desktop companion (desktop/, its own Cargo workspace): GTK 4 from Ubuntu 26.04, its only target.
    name: Desktop companion
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      # Built like the release package: the Chrome extension's public Hugging Face OAuth app (one app for both).
      LAUNCHPAD_HF_CLIENT_ID: ${{ vars.HF_CLIENT_ID }}
    steps:
      - name: Install build tools and GTK 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libgtk-4-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: desktop
      - name: Check
        run: cargo check --manifest-path desktop/Cargo.toml --all-targets --locked
      - name: Lint
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml --locked

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Run Rust tests (default workspace members)
        run: cargo test --locked --timings
      - name: Upload Cargo timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-tests
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Home Space tests (deploy/hf-home)
        working-directory: deploy/hf-home
        run: |
          python3 -m venv /tmp/hf-home-env
          /tmp/hf-home-env/bin/pip install -r requirements.txt
          /tmp/hf-home-env/bin/python -m unittest discover -s tests -v

  build:
    name: Release build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build.yml

  main-build:
    name: Main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      main-build: true
