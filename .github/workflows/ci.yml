name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Install UI dependencies
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Rust linting (including desktop)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check UI types
        working-directory: web
        run: pnpm typecheck
      - name: Check terminal output
        working-directory: web
        run: pnpm test:terminals
      - name: Check clipboard attachments
        working-directory: web
        run: pnpm test:attachments

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Run Rust tests (default workspace members)
        run: cargo test --locked

  build:
    name: Build artifacts (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Build UI before embedding it in the daemon
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: bash -n packaging/install.sh packaging/install-macos.sh packaging/update.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('packaging/install.ps1', 'packaging/update.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Build release binaries
        run: cargo build --release --locked -p launchpad -p launchpad-desktop
      - name: Run release tests
        run: cargo test --release --locked
      - name: Smoke-test release CLI
        shell: bash
        run: target/release/launchpad${{ runner.os == 'Windows' && '.exe' || '' }} --help
      - name: Package release
        shell: bash
        run: |
          mkdir -p artifacts/target/release artifacts/web artifacts/desktop/src-tauri
          cp target/release/launchpad${{ runner.os == 'Windows' && '.exe' || '' }} target/release/launchpad-desktop${{ runner.os == 'Windows' && '.exe' || '' }} artifacts/target/release/
          cp -r packaging skills artifacts/
          cp -r desktop/src-tauri/icons artifacts/desktop/src-tauri/
          cp -r web/dist artifacts/web/
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          tar -czf launchpad-${{ matrix.platform }}.tar.gz -C artifacts .
          if command -v sha256sum >/dev/null; then sha256sum launchpad-${{ matrix.platform }}.tar.gz; else shasum -a 256 launchpad-${{ matrix.platform }}.tar.gz; fi > launchpad-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-${{ matrix.platform }}
          path: |
            launchpad-${{ matrix.platform }}.tar.gz
            launchpad-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
