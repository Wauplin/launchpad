name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Install UI dependencies
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Rust linting (including desktop)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check UI types
        working-directory: web
        run: pnpm typecheck
      - name: Hook order lint
        working-directory: web
        run: pnpm lint:hooks
      - name: Check terminal output
        working-directory: web
        run: pnpm test:terminals
      - name: Check session log recovery
        working-directory: web
        run: pnpm test:sessions
      - name: Check operation retries
        working-directory: web
        run: pnpm test:operations
      - name: Composer defaults regressions
        working-directory: web
        run: pnpm test:composer
      - name: Ask proposal regressions
        working-directory: web
        run: pnpm test:proposals
      - name: Bot chat rows
        working-directory: web
        run: pnpm test:chat
      - name: Draft persistence regressions
        working-directory: web
        run: pnpm test:drafts
      - name: Tour anchors and demo handlers
        working-directory: web
        run: pnpm test:tour
      - name: Agent Markdown commit regressions
        working-directory: web
        run: pnpm test:markdown
      - name: Code viewer safety regressions
        working-directory: web
        run: pnpm test:code
      - name: Check clipboard attachments
        working-directory: web
        run: pnpm test:attachments

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Run Rust tests (default workspace members)
        run: cargo test --locked

  build:
    name: Build artifacts (linux-x86_64)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-ubuntu-22.04
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Build UI before embedding it in the daemon
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check installer syntax
        run: bash -n packaging/install.sh packaging/update.sh
      - name: Build release binaries
        run: cargo build --release --locked -p launchpad -p launchpad-desktop
      - name: Run release tests
        run: cargo test --release --locked
      - name: Smoke-test release CLI
        run: target/release/launchpad --help
      - name: Package release
        run: |
          mkdir -p artifacts/target/release artifacts/web artifacts/desktop/src-tauri
          cp target/release/launchpad target/release/launchpad-desktop artifacts/target/release/
          cp -r packaging skills artifacts/
          cp -r desktop/src-tauri/icons artifacts/desktop/src-tauri/
          cp -r web/dist artifacts/web/
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          tar -czf launchpad-linux-x86_64.tar.gz -C artifacts .
          sha256sum launchpad-linux-x86_64.tar.gz > launchpad-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-linux-x86_64
          path: |
            launchpad-linux-x86_64.tar.gz
            launchpad-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
